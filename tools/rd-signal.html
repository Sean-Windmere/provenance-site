s9Vs/AV5eB7tUz0DNwM2egN7ubOeH9uJ6BnoGegZ6Bmz8Dvdnd/DnvJ/YM9Az0DHzlDHSPDc1Ab3Ybms4erGegZ6BnoGfg1piB3uxujd+VfqeegZ6BnoGegQ3NwEHa7DY0Rz1Yz0DPQM9Az8ABnoHe7A7wb2C/fs9Az0DPQM/AV85Ab3ZfOUfd4yDNQH+snoGegUMnA73ZHTrf6/6kPQM9Az0Dh2wGerM7ZL/1/cF7BnoGvnIGusfBkoH/HwAA//+OoxiqAAAABklEQVQDAGsQTXEktsj+AAAAAElFTkSuQmCC" alt=""></span> R&amp;D Signal</div>

      <span class="pill" id="hdrCompany">Not started</span>
    </div>
  </div>

  <div class="progress-rail"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div id="app"></div>

</div>

<script>
(function(){

  // ---------- Question model ----------
  const INDUSTRY_LABELS = {
    software: 'Software / Technology',
    manufacturing: 'Manufacturing',
    engineering: 'Engineering / Architecture',
    agfood: 'Farming, Food & Beverage',
    construction: 'Construction / Trades',
    lifesci: 'Life Sciences / Biotech',
    consumer: 'Consumer Products / Apparel',
    other: 'Other',
  };

  const QUALIFY_OPTIONS = [
    { id:'improve', label:'Tried to build or improve something', example:'a new product, recipe, crop variety, or way of doing things, even if it didn\u2019t fully work out' },
    { id:'experiment', label:'Tried different approaches before landing on the right one', example:'different recipes, ingredients, materials, mixes, or methods' },
    { id:'uncertainty', label:'Weren\u2019t sure going in whether it would actually work', example:'genuine trial and error, not just picking from a catalog' },
    { id:'testing', label:'Ran tests, trial batches, or pilot versions', example:'before rolling something out for real, at full scale' },
    { id:'process', label:'Changed equipment, a process, or how something is made or grown', example:'to solve a real, practical problem you were running into' },
  ];

  const state = {
    step: 0,
    company: '',
    industry: '',
    industryOther: '',
    qualify: {},
    wageAmount: '',
    hasContractors: null,
    contractorAmount: '',
    claimedBefore: null,
    spendTrend: null,
    isStartup: null,
    name: '',
    email: '',
    title: '',
    submitted: false,
  };

  const steps = ['intro','qualify','wages','contractors','history','startup','result'];

  const app = document.getElementById('app');
  const hdrCompany = document.getElementById('hdrCompany');
  const progressFill = document.getElementById('progressFill');

  function qualifyCount(){
    return Object.values(state.qualify).filter(Boolean).length;
  }

  function num(v){
    const n = parseFloat(String(v).replace(/[^0-9.]/g,''));
    return isNaN(n) ? 0 : n;
  }

  // Rate logic: mirrors the Alternative Simplified Credit's actual formula,
  // credit = 14% x (current QRE - 50% x prior-3-year average QRE).
  // First-time claimants (no QRE in any of the prior 3 years) get an exact
  // flat 6% under the ASC no-history rule, not a range.
  // For returning claimants, working through that formula across realistic
  // growth/decline scenarios gives roughly: flat spending lands near 7%,
  // meaningful growth pushes toward 9-14%, and decline can fall as low as
  // 0% since a large enough drop can wipe the credit out entirely.
  function rateRange(){
    if(state.claimedBefore !== true){
      return { low:0.06, high:0.06 };
    }
    switch(state.spendTrend){
      case 'up': return { low:0.09, high:0.14 };
      case 'flat': return { low:0.05, high:0.09 };
      case 'down': return { low:0.00, high:0.06 };
      default: return { low:0.02, high:0.12 };
    }
  }

  function estimate(){
    let qre = num(state.wageAmount);
    if(state.hasContractors === true){
      qre += num(state.contractorAmount) * 0.65; // contract research qualifies at 65%
    }
    const r = rateRange();
    const low = Math.round(qre * r.low / 100) * 100;
    const high = Math.round(qre * r.high / 100) * 100;
    return { low, high, qre, rate: r };
  }

  function indication(){
    const c = qualifyCount();
    if(c === 0) return 'unlikely';
    if(c <= 2) return 'possible';
    return 'likely';
  }

  function fmt(n){
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  function gaugePct(){
    const c = qualifyCount();
    if(c === 0) return 6;
    if(c <= 2) return 50;
    return 92;
  }

  function updateProgress(){
    const idx = steps.indexOf(steps[state.step]);
    const pct = Math.min(100, Math.round((idx / (steps.length-1)) * 100));
    progressFill.style.width = pct + '%';
  }

  function render(){
    const s = steps[state.step];
    hdrCompany.textContent = state.company || 'Not started';
    updateProgress();
    if(s === 'result'){
      app.innerHTML = renderResult();
    } else {
      app.innerHTML = `<div class="board">${renderPanel(s)}${renderLedger()}</div>`;
    }
    bindEvents(s);
  }

  function renderLedger(){
    const c = qualifyCount();
    const items = QUALIFY_OPTIONS.filter(o => state.qualify[o.id]);
    const est = estimate();
    const ind = indication();
    const indLabel = { likely:'Likely Qualifies', possible:'Possibly Qualifies', unlikely:'Not Enough Signal Yet' }[ind];

    return `
    <div class="ledger">
      <div class="ledger-title"><span><span class="live-dot"></span>Live Estimate</span><span>${c}/5</span></div>
      <ul class="tick-list">
        ${items.length ? items.map(i=>`<li><span class="tick-mark">&#10003;</span><span>${i.label}</span></li>`).join('') : '<li class="tick-empty" style="animation:none;opacity:1;">Nothing marked yet. Answer the questions to see this build.</li>'}
      </ul>
      <div class="subtotal-box">
        ${state.wageAmount ? `<div class="subtotal-row"><span>Est. qualifying spend</span><span class="num">${fmt(est.qre)}</span></div>` : ''}
        <div class="gauge-wrap">
          <div class="gauge-label"><span>Unlikely</span><span>Possible</span><span>Likely</span></div>
          <div class="gauge-track">
            <div class="gauge-fill" style="width:${gaugePct()}%"></div>
            <div class="gauge-dot" style="left:${gaugePct()}%"></div>
          </div>
          <div class="gauge-status ${ind}">${indLabel}</div>
        </div>
      </div>
    </div>`;
  }

  function optRow(opt, checked, name, type){
    return `<label class="opt ${checked?'checked':''}">
      <input type="${type}" name="${name}" value="${opt.id}" ${checked?'checked':''} />
      <span class="opt-label"><b>${opt.label}</b>${opt.example ? `<span class="opt-example">${opt.example}</span>` : ''}</span>
    </label>`;
  }

  function renderPanel(s){
    if(s === 'intro'){
      return `<div class="panel">
        <div class="eyebrow">Step 1 &middot; About your business</div>
        <h1 class="q">Let's take a first look at your R&amp;D activity.</h1>
        <p class="q-sub">Two minutes, a handful of questions. You'll get a directional read on whether it's worth pursuing further, before you spend anything.</p>
        <div class="field-row">
          <label for="company">Company name</label>
          <input type="text" id="company" placeholder="e.g. Ridgeline Farms, or Acme Robotics" value="${state.company}" />
        </div>
        <div class="field-row">
          <label for="industry">Industry</label>
          <select id="industry">
            <option value="">Select one&hellip;</option>
            ${Object.keys(INDUSTRY_LABELS).map(code => `<option value="${code}" ${state.industry===code?'selected':''}>${INDUSTRY_LABELS[code]}</option>`).join('')}
          </select>
          <div class="helper-note" style="margin-top:0.8rem;">The R&amp;D credit isn't limited to tech and pharma. Farms improving crop yields, breweries dialing in a new recipe, and manufacturers tweaking a process all commonly qualify too.</div>
        </div>
        ${state.industry === 'other' ? `
        <div class="field-row">
          <label for="industryOther">Tell us a bit about your industry</label>
          <input type="text" id="industryOther" placeholder="e.g. commercial fishing, custom furniture" value="${state.industryOther}" />
        </div>` : ''}
        <div class="nav-row">
          <span class="step-indicator">Step 1 of 6</span>
          <button class="btn primary" id="next" ${!state.company?'disabled':''}>Begin &rarr;</button>
        </div>
      </div>`;
    }

    if(s === 'qualify'){
      return `<div class="panel">
        <div class="eyebrow">Step 2 &middot; What you've been doing</div>
        <h1 class="q">In the past year, has your business done any of the following?</h1>
        <p class="q-sub">Select everything that applies. The tax code's definition of "R&amp;D" is broader than most people realize. Here are a few examples of what can qualify, not a complete list.</p>
        <div class="options">
          ${QUALIFY_OPTIONS.map(o=>optRow(o, !!state.qualify[o.id], 'qualify', 'checkbox')).join('')}
        </div>
        <div class="nav-row">
          <button class="btn ghost" id="back">&larr; Back</button>
          <span class="step-indicator">Step 2 of 6</span>
          <button class="btn primary" id="next">Continue &rarr;</button>
        </div>
      </div>`;
    }

    if(s === 'wages'){
      return `<div class="panel">
        <div class="eyebrow">Step 3 &middot; People involved</div>
        <h1 class="q">Roughly how much do you spend a year on wages for people doing this kind of work?</h1>
        <p class="q-sub">This isn't limited to engineers or scientists. Depending on your business, it could be a brewer, a farm manager, a machinist, or whoever's doing the hands-on building and testing.</p>
        <div class="field-row">
          <label for="wageAmount">Approximate annual amount</label>
          <div class="dollar-input-wrap">
            <input type="text" inputmode="numeric" id="wageAmount" placeholder="120,000" value="${state.wageAmount}" />
          </div>
          <div class="field-hint">A rough number is fine. This is directional, not a final calculation. If the work is done entirely by contractors and you have no employees doing it, enter 0.</div>
        </div>
        <div class="nav-row">
          <button class="btn ghost" id="back">&larr; Back</button>
          <span class="step-indicator">Step 3 of 6</span>
          <button class="btn primary" id="next" ${state.wageAmount===''?'disabled':''}>Continue &rarr;</button>
        </div>
      </div>`;
    }

    if(s === 'contractors'){
      return `<div class="panel">
        <div class="eyebrow">Step 4 &middot; Outside help</div>
        <h1 class="q">Do you pay outside people or firms to help with this kind of work?</h1>
        <p class="q-sub">Contract help can count too. It typically qualifies at a reduced statutory rate, since a contractor's fee usually bundles in costs beyond just the research work itself.</p>
        <div class="options">
          ${optRow({id:'yes',label:'Yes'}, state.hasContractors===true, 'hasContractors', 'radio')}
          ${optRow({id:'no',label:'No'}, state.hasContractors===false, 'hasContractors', 'radio')}
        </div>
        ${state.hasContractors===true ? `
        <div class="field-row">
          <label for="contractorAmount">Roughly how much a year?</label>
          <div class="dollar-input-wrap">
            <input type="text" inputmode="numeric" id="contractorAmount" placeholder="40,000" value="${state.contractorAmount}" />
          </div>
        </div>` : ''}
        <div class="nav-row">
          <button class="btn ghost" id="back">&larr; Back</button>
          <span class="step-indicator">Step 4 of 6</span>
          <button class="btn primary" id="next" ${state.hasContractors===null || (state.hasContractors===true && !num(state.contractorAmount)) ?'disabled':''}>Continue &rarr;</button>
        </div>
      </div>`;
    }

    if(s === 'history'){
      return `<div class="panel">
        <div class="eyebrow">Step 5 &middot; Your claim history</div>
        <h1 class="q">Have you claimed the R&amp;D tax credit before?</h1>
        <p class="q-sub">This changes how the credit is actually calculated. First-time claims use a flat 6% rate since there's no prior spending to compare against.</p>
        <div class="options">
          ${optRow({id:'yes',label:'Yes, in a prior year'}, state.claimedBefore===true, 'claimedBefore', 'radio')}
          ${optRow({id:'no',label:'No, this would be our first time'}, state.claimedBefore===false, 'claimedBefore', 'radio')}
        </div>
        ${state.claimedBefore===true ? `
        <div class="eyebrow" style="margin-top:0.4rem;">One more thing</div>
        <h1 class="q" style="font-size:1.2rem;">Has your spending on this kind of work gone up, stayed flat, or gone down over the last few years?</h1>
        <div class="options">
          ${optRow({id:'up',label:'Gone up'}, state.spendTrend==='up', 'spendTrend', 'radio')}
          ${optRow({id:'flat',label:'Stayed about the same'}, state.spendTrend==='flat', 'spendTrend', 'radio')}
          ${optRow({id:'down',label:'Gone down'}, state.spendTrend==='down', 'spendTrend', 'radio')}
          ${optRow({id:'unsure',label:'Not sure'}, state.spendTrend==='unsure', 'spendTrend', 'radio')}
        </div>` : ''}
        <div class="nav-row">
          <button class="btn ghost" id="back">&larr; Back</button>
          <span class="step-indicator">Step 5 of 6</span>
          <button class="btn primary" id="next" ${state.claimedBefore===null || (state.claimedBefore===true && !state.spendTrend) ?'disabled':''}>Continue &rarr;</button>
        </div>
      </div>`;
    }

    if(s === 'startup'){
      return `<div class="panel">
        <div class="eyebrow">Step 6 &middot; Startup offset</div>
        <h1 class="q">Is your company under $5M in annual revenue and within its first five years of having revenue?</h1>
        <p class="q-sub">If yes, you may be able to apply the credit against <b>payroll tax</b> rather than income tax. That's a detail a lot of early-stage companies don't realize applies to them, whether or not they're currently profitable.</p>
        <div class="options">
          ${optRow({id:'yes',label:'Yes'}, state.isStartup===true, 'isStartup', 'radio')}
          ${optRow({id:'no',label:'No'}, state.isStartup===false, 'isStartup', 'radio')}
          ${optRow({id:'unsure',label:"Not sure"}, state.isStartup==='unsure', 'isStartup', 'radio')}
        </div>
        <div class="nav-row">
          <button class="btn ghost" id="back">&larr; Back</button>
          <span class="step-indicator">Step 6 of 6</span>
          <button class="btn primary" id="next" ${state.isStartup===null?'disabled':''}>See My Results &rarr;</button>
        </div>
      </div>`;
    }
  }

  function renderResult(){
    const ind = indication();
    const est = estimate();
    const indMeta = {
      likely: {label:'Likely Qualifies', note:'Your activity shows signals across multiple areas of the federal Four-Part Test.'},
      possible: {label:'Possibly Qualifies', note:'You show at least one qualifying signal. A closer look would clarify scope and materiality.'},
      unlikely: {label:'Not Enough Signal Yet', note:"Based on what's entered, we didn't see a clear qualifying activity. That can change with more detail on how the work was actually done."},
    }[ind];
    const industryDisplay = state.industry === 'other' && state.industryOther ? state.industryOther : (INDUSTRY_LABELS[state.industry] || 'Not specified');

    if(state.submitted){
      return `<div class="result-wrap">
        <div class="result-head">
          <div>
            <h2>Got it. Your assessment is in.</h2>
            <div class="stamp">&#10003; Received. We&rsquo;ll be in touch.</div>
          </div>
        </div>
        <div class="result-footer tight">
          <a href="https://oneprovenance.build" target="_blank" rel="noopener">oneprovenance.build</a>
          <span>&middot;</span>
          <a href="mailto:contact@oneprovenance.build">contact@oneprovenance.build</a>
          <span>&middot;</span>
          <a href="tel:+19016528591">901.652.8591</a>
        </div>
      </div>`;
    }

    return `<div class="result-wrap">
      <div class="result-head">
        <div>
          <h2>${indMeta.label}</h2>
          <p style="max-width:440px;font-size:0.92rem;color:var(--ink-soft);line-height:1.6;margin:0;">${indMeta.note}</p>
        </div>
        <div style="text-align:right;">
          <div class="estimate-figure" id="estimateFigure">$0</div>
          <div class="estimate-caption">${est.low === est.high ? 'rough estimated federal credit' : 'rough estimated federal credit range'}</div>
        </div>
      </div>

      <div class="result-grid">
        <div>
          <h3>What we saw</h3>
          <ul>
            ${QUALIFY_OPTIONS.filter(o=>state.qualify[o.id]).map(o=>`<li>${o.label}</li>`).join('') || '<li>No qualifying activity selected</li>'}
          </ul>
        </div>
        <div>
          <h3>Worth knowing</h3>
          <ul>
            <li>Industry: ${industryDisplay}</li>
            ${state.isStartup===true ? '<li>You may qualify for the <b>payroll tax offset</b> as an early-stage company</li>' : ''}
            ${state.hasContractors===true ? '<li>Outside/contract costs were included at a 65% qualifying rate</li>' : ''}
            <li>${state.claimedBefore===true ? 'Estimate uses a rate range based on your reported spending trend' : 'First-time claims use a flat 6% rate under IRS rules, since there\u2019s no prior-year spending to compare against'}</li>
          </ul>
        </div>
      </div>

      <div class="lead-form">
        <h3>Want the full picture?</h3>
        <p>We'll personally review your answers and follow up with a more precise read. No cost, no commitment.</p>
        <div class="lead-grid">
          <input type="text" id="leadName" placeholder="Full name" value="${state.name}" />
          <input type="email" id="leadEmail" placeholder="Preferred email" value="${state.email}" />
          <input type="text" id="leadCompany" placeholder="Company name" value="${state.company}" />
          <input type="text" id="leadTitle" placeholder="Your title" value="${state.title}" />
        </div>
        <button class="btn primary" id="submitLead" ${!state.name || !state.email ? 'disabled' : ''}>Send Me the Full Estimate &rarr;</button>
        <div class="lead-error" id="leadError" style="display:none;">Something went wrong sending that. Please try again, or email us directly below.</div>
      </div>

      <div class="disclaimer">
        This tool provides a rough, directional estimate only and is not a formal R&amp;D tax credit calculation, tax advice, or a guarantee of eligibility. Actual eligibility and credit amounts depend on a detailed analysis of qualifying activities and the applicable calculation method, and should be confirmed by a qualified tax professional.
      </div>

      <div class="result-footer">
        <a href="https://oneprovenance.build" target="_blank" rel="noopener">oneprovenance.build</a>
        <span>&middot;</span>
        <a href="mailto:contact@oneprovenance.build">contact@oneprovenance.build</a>
        <span>&middot;</span>
        <a href="tel:+19016528591">901.652.8591</a>
      </div>
    </div>`;
  }

  function animateEstimate(){
    const target = estimate();
    const el = document.getElementById('estimateFigure');
    if(!el) return;
    const isSingle = target.low === target.high;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion){ el.textContent = isSingle ? fmt(target.low) : `${fmt(target.low)}\u2013${fmt(target.high)}`; return; }
    const duration = 700;
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1-p, 3);
      const low = target.low * eased;
      const high = target.high * eased;
      el.textContent = isSingle ? fmt(low) : `${fmt(low)}\u2013${fmt(high)}`;
      if(p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function bindEvents(s){
    const back = document.getElementById('back');
    const next = document.getElementById('next');
    if(back) back.addEventListener('click', ()=>{ state.step = Math.max(0, state.step-1); render(); });
    if(next) next.addEventListener('click', ()=>{ state.step = Math.min(steps.length-1, state.step+1); render(); });

    if(s === 'intro'){
      document.getElementById('company').addEventListener('input', e=>{
        state.company = e.target.value;
        document.getElementById('next').disabled = !state.company;
        hdrCompany.textContent = state.company || 'Not started';
      });
      const industrySel = document.getElementById('industry');
      industrySel.addEventListener('change', e=>{ state.industry = e.target.value; render(); });
      const other = document.getElementById('industryOther');
      if(other) other.addEventListener('input', e=>{ state.industryOther = e.target.value; });
    }

    if(s === 'qualify'){
      document.querySelectorAll('input[name=qualify]').forEach(inp=>{
        inp.addEventListener('change', e=>{
          state.qualify[e.target.value] = e.target.checked;
          render();
        });
      });
    }

    if(s === 'wages'){
      const inp = document.getElementById('wageAmount');
      inp.addEventListener('input', e=>{
        state.wageAmount = e.target.value;
        document.getElementById('next').disabled = state.wageAmount==='';
        render_ledger_only();
      });
    }

    if(s === 'contractors'){
      document.querySelectorAll('input[name=hasContractors]').forEach(inp=>{
        inp.addEventListener('change', e=>{
          state.hasContractors = e.target.value === 'yes';
          if(!state.hasContractors) state.contractorAmount = '';
          render();
        });
      });
      const camt = document.getElementById('contractorAmount');
      if(camt) camt.addEventListener('input', e=>{
        state.contractorAmount = e.target.value;
        document.getElementById('next').disabled = !num(state.contractorAmount);
        render_ledger_only();
      });
    }

    if(s === 'history'){
      document.querySelectorAll('input[name=claimedBefore]').forEach(inp=>{
        inp.addEventListener('change', e=>{
          state.claimedBefore = e.target.value === 'yes';
          if(!state.claimedBefore) state.spendTrend = null;
          render();
        });
      });
      document.querySelectorAll('input[name=spendTrend]').forEach(inp=>{
        inp.addEventListener('change', e=>{ state.spendTrend = e.target.value; render(); });
      });
    }

    if(s === 'startup'){
      document.querySelectorAll('input[name=isStartup]').forEach(inp=>{
        inp.addEventListener('change', e=>{
          state.isStartup = e.target.value === 'yes' ? true : (e.target.value === 'no' ? false : 'unsure');
          render();
        });
      });
    }

    if(s === 'result'){
      animateEstimate();
      if(!state.submitted){
        const nameInp = document.getElementById('leadName');
        const emailInp = document.getElementById('leadEmail');
        const companyInp = document.getElementById('leadCompany');
        const titleInp = document.getElementById('leadTitle');
        const submitBtn = document.getElementById('submitLead');
        const errorEl = document.getElementById('leadError');
        function toggle(){
          state.name = nameInp.value;
          state.email = emailInp.value;
          state.company = companyInp.value;
          state.title = titleInp.value;
          submitBtn.disabled = !state.name || !state.email;
        }
        nameInp.addEventListener('input', toggle);
        emailInp.addEventListener('input', toggle);
        companyInp.addEventListener('input', toggle);
        titleInp.addEventListener('input', toggle);
        submitBtn.addEventListener('click', async ()=>{
          toggle();
          errorEl.style.display = 'none';
          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending…';
          const est = estimate();
          const lead = {
            access_key: 'cd8b4eb8-4f53-4887-851a-5af029ddb09b',
            subject: 'New R&D Signal estimate request',
            from_name: 'Provenance R&D Signal tool',
            company: state.company,
            title: state.title,
            industry: (state.industry === 'other' ? state.industryOther : INDUSTRY_LABELS[state.industry]) || 'Not specified',
            name: state.name,
            email: state.email,
            indication: indication(),
            qualifyingSignals: QUALIFY_OPTIONS.filter(o=>state.qualify[o.id]).map(o=>o.label).join(' | ') || 'None selected',
            claimedBefore: state.claimedBefore,
            spendTrend: state.spendTrend,
            wageAmount: state.wageAmount,
            hasContractors: state.hasContractors,
            contractorAmount: state.contractorAmount,
            isStartup: state.isStartup,
            estimateLow: est.low,
            estimateHigh: est.high,
            submittedAt: new Date().toISOString(),
          };
          try{
            const res = await fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify(lead),
            });
            const result = await res.json();
            if(!result.success) throw new Error(result.message || 'Submission failed');
            state.submitted = true;
            render();
          }catch(err){
            console.error('Could not send lead:', err);
            errorEl.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Send Me the Full Estimate →';
          }
        });
      }
    }
  }

  // Lightweight re-render of just the ledger panel while typing, to avoid
  // losing focus on the active text input.
  function render_ledger_only(){
    const ledgerEl = document.querySelector('.ledger');
    if(!ledgerEl) return;
    const temp = document.createElement('div');
    temp.innerHTML = renderLedger();
    ledgerEl.replaceWith(temp.firstElementChild);
  }

  render();
})();
</script>
